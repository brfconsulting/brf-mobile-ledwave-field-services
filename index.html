<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field Service • Download</title>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --background: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 480px;
      width: 100%;
    }

    .card {
      background: radial-gradient(
        120% 120% at top right,
        #1e1b4b,
        var(--card)
      );
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: white;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.25s ease;
      box-shadow: 0 10px 30px rgba(79, 70, 229, 0.45);
    }

    .download-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(
        135deg,
        var(--primary-dark),
        var(--primary)
      );
      box-shadow: 0 14px 40px rgba(79, 70, 229, 0.6);
    }

    .info {
      margin-top: 22px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }

    .apk-icon {
      font-size: 36px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="apk-icon">📱</div>

      <div class="logo">Field Service</div>
      <div class="subtitle">
        Baixe a versão mais recente do aplicativo
      </div>

      <a
        href="./field-services-release.apk"
        class="download-btn"
        download
      >
        ⬇️ Download do APK
      </a>

      <div class="info">
        • Compatível com Android<br />
        • Instalação manual (APK)<br />
        • Sempre aponta para a versão mais recente
      </div>
    </div>

    <div class="footer">
      <span id="year"></span> Field Service • Distribuição interna
    </div>
  </div>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
